# Configuração do Alembic para uso em linha de comando (gerar e inspecionar
# migrações). A aplicação NÃO lê este arquivo: na subida, app/database.py
# monta a configuração em código e aplica as migrações sozinha.
#
# O banco é o mesmo da aplicação (GESTORDECONTRATO_DB_PATH ou o padrão);
# a URL vem de app/database.py, não daqui.
#
#   .venv/bin/alembic current                              # revisão do banco
#   .venv/bin/alembic revision --autogenerate -m "..."     # nova migração
#   .venv/bin/alembic upgrade head                         # aplicar

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

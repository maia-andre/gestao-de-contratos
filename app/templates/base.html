<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Central de Apoio à Equipe de Fiscalização de Contratos{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="masthead__brand" href="/">
        <svg class="masthead__selo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 3 L34 8 V19 C34 28 28 34 20 37 C12 34 6 28 6 19 V8 Z" stroke="#C9A94D" stroke-width="1.6" />
          <path d="M13 20 L18 25 L27 14" stroke="#C9A94D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="masthead__title">Central de Apoio à Equipe de Fiscalização de Contratos</span>
      </a>
      <nav class="masthead__nav" aria-label="Navegação principal">
        <a href="/contratos">Contratos</a>
        <a href="/painel">Painel de prazos</a>
        <a href="/parametros">Parâmetros</a>
        <a href="/exportar">Exportar</a>
        <a href="/importar">Importar</a>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    {% block content %}{% endblock %}
  </main>

  <footer class="rodape">
    <p>{{ orgao }} — Lei 14.133/2021 · Decreto Municipal 19.721/2024 (SJC)</p>
  </footer>
</body>
</html>

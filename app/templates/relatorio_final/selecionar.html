{% extends "base.html" %}

{% block title %}Relatório Final — Contrato {{ contrato.numero }}{% endblock %}

{% block content %}
<a class="voltar" href="/contratos/{{ contrato.id }}/relatorio-final">&larr; Voltar ao parecer</a>

<div class="cabecalho-pagina">
  <p class="eyebrow">Relatório Final de Consecução de Objetivos</p>
  <h1>Emissor do relatório</h1>
</div>

<form method="get" action="/contratos/{{ contrato.id }}/relatorio-final/documento" class="form--larga">
  <label>Emissor (Gestor do contrato)
    <select name="emissor_id">
      {% for membro in membros %}
      <option value="{{ membro.id }}"{% if preselecionado and membro.id == preselecionado.id %} selected{% endif %}>{{ membro.nome }} — {{ membro.matricula_cargo }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Gerar relatório</button>
</form>
{% endblock %}
